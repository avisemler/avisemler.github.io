<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barnet Parking Restrictions Map</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
    <style>
        :root {
            --brand: #1a73e8;
            --brand-dark: #1557b0;
            --ink: #202124;
            --muted: #5f6368;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            height: 100vh; display: flex; flex-direction: column; color: var(--ink);
        }
        #header {
            background: linear-gradient(135deg, #1a73e8 0%, #1557b0 100%);
            color: white; padding: 14px 22px; z-index: 3;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
            display: flex; align-items: center; gap: 14px;
        }
        #header .title { flex: 1; }
        #header h1 { font-size: 20px; font-weight: 600; letter-spacing: .2px; }
        #header .subtitle { font-size: 12.5px; opacity: .85; margin-top: 2px; }
        #status {
            font-size: 12.5px; background: rgba(255,255,255,.15);
            padding: 6px 12px; border-radius: 999px; white-space: nowrap;
            backdrop-filter: blur(4px);
        }
        #main { display: flex; flex: 1; overflow: hidden; }
        #map { flex: 1; position: relative; background: #eaeaea; }
        #sidebar {
            width: 360px; background: #fff; border-left: 1px solid #e3e3e3;
            overflow-y: auto; padding: 18px 18px 28px;
        }
        .sidebar-head {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 14px;
        }
        #sidebar h2 { font-size: 16px; font-weight: 600; }
        #count-badge {
            background: #e8f0fe; color: var(--brand-dark); font-size: 12px;
            font-weight: 600; padding: 3px 10px; border-radius: 999px;
        }
        .restriction-item {
            padding: 12px 14px; margin-bottom: 9px; background: #f8f9fa;
            border-left: 4px solid var(--brand); border-radius: 8px; cursor: pointer;
            transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
        }
        .restriction-item:hover {
            background: #eef3fe; transform: translateX(3px);
            box-shadow: 0 2px 8px rgba(26,115,232,.15);
        }
        .restriction-street { font-weight: 600; font-size: 14px; margin-bottom: 3px; }
        .restriction-type { color: var(--muted); font-size: 13px; margin-bottom: 4px; line-height: 1.35; }
        .restriction-distance { color: var(--brand); font-size: 12.5px; font-weight: 600; }
        .pill { display:inline-block; font-size:11px; padding:1px 8px; border-radius:999px;
                background:#eceff1; color:#455a64; margin-left:6px; vertical-align:middle; }

        /* Street search */
        .search-wrap { position: relative; margin-bottom: 16px; }
        #street-search {
            width: 100%; padding: 10px 34px 10px 34px; border: 1px solid #dadce0;
            border-radius: 10px; font-size: 14px; outline: none; color: var(--ink);
            transition: border-color .12s, box-shadow .12s;
        }
        #street-search:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(26,115,232,.15); }
        .search-wrap .search-icon {
            position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
            color: var(--muted); font-size: 14px; pointer-events: none;
        }
        #search-clear {
            position: absolute; right: 7px; top: 50%; transform: translateY(-50%);
            border: none; background: transparent; cursor: pointer; color: var(--muted);
            font-size: 15px; line-height: 1; padding: 4px 6px; border-radius: 6px; display: none;
        }
        #search-clear:hover { background: #f1f3f4; color: var(--ink); }
        #suggestions {
            position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: #fff;
            border: 1px solid #e3e3e3; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.16);
            max-height: 300px; overflow-y: auto; z-index: 5; display: none;
        }
        .sugg {
            padding: 9px 12px; cursor: pointer; font-size: 13.5px; display: flex;
            justify-content: space-between; align-items: center; gap: 10px;
            border-bottom: 1px solid #f1f3f4;
        }
        .sugg:last-child { border-bottom: none; }
        .sugg:hover, .sugg.active { background: #eef3fe; }
        .sugg .nm { font-weight: 500; }
        .sugg .cnt { color: var(--muted); font-size: 11.5px; white-space: nowrap; }

        /* Map controls */
        .map-btn {
            position: absolute; z-index: 2; background: #fff; border: none;
            border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.2);
            cursor: pointer; font-size: 14px; color: var(--ink);
            display: flex; align-items: center; gap: 7px; padding: 10px 13px;
            transition: background .12s;
        }
        .map-btn:hover { background: #f1f3f4; }
        #locate-btn { top: 14px; right: 14px; font-weight: 600; }

        .legend {
            position: absolute; bottom: 22px; right: 14px; background: #fff;
            padding: 13px 15px; border-radius: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.22);
            z-index: 2; font-size: 13px; min-width: 172px;
        }
        .legend h3 { font-size: 13px; margin-bottom: 4px; }
        .legend .hint { font-size: 11px; color: var(--muted); margin-bottom: 9px; }
        .legend-item {
            display: flex; align-items: center; margin-bottom: 5px; cursor: pointer;
            user-select: none; padding: 2px 4px; border-radius: 6px; transition: background .1s;
        }
        .legend-item:hover { background: #f1f3f4; }
        .legend-item.off { opacity: .38; }
        .legend-color { width: 22px; height: 5px; margin-right: 9px; border-radius: 3px; flex: none; }
        .legend-item.off .legend-color { background: #bbb !important; }

        .loader { text-align: center; padding: 24px 10px; color: var(--muted); font-size: 14px; }
        .error {
            background: #fdecef; border-left: 4px solid #e91e63; padding: 12px;
            margin: 8px 0; border-radius: 8px; color: #b0003a; font-size: 13px;
        }
        .maplibregl-popup { max-width: 320px !important; }
        .maplibregl-popup-content { border-radius: 12px; padding: 14px 16px; box-shadow: 0 6px 22px rgba(0,0,0,.22); }
        button.reset-btn {
            background: var(--brand); color: #fff; border: none; padding: 10px 18px;
            border-radius: 8px; cursor: pointer; font-size: 13.5px; font-weight: 600;
            transition: background .12s; width: 100%;
        }
        button.reset-btn:hover { background: var(--brand-dark); }

        /* Onboarding toast */
        #toast {
            position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
            background: rgba(32,33,36,.92); color: #fff; padding: 10px 18px;
            border-radius: 999px; font-size: 13px; z-index: 4; pointer-events: none;
            opacity: 0; transition: opacity .4s; white-space: nowrap;
        }
        #toast.show { opacity: 1; }

        @media (max-width: 768px) {
            #header { flex-wrap: wrap; }
            #main { flex-direction: column; }
            #sidebar { width: 100%; max-height: 42vh; border-left: none; border-top: 1px solid #e3e3e3; }
            .legend { bottom: 14px; right: 10px; }
        }
    </style>
</head>
<body>
    <div id="header">
        <div class="title">
            <h1>🅿️ Barnet Parking Restrictions</h1>
            <div class="subtitle">Click the map or a card to see nearby kerbside rules</div>
        </div>
        <div id="status">Getting your location…</div>
    </div>
    <div id="main">
        <div id="map">
            <button id="locate-btn" class="map-btn" title="Centre on my location">📍 Locate me</button>
            <div id="toast">💡 Tip: click anywhere on the map to inspect that spot</div>
            <div class="legend" id="legend">
                <h3>Restriction Types</h3>
                <div class="hint">Click a type to show / hide it</div>
                <div id="legend-items"></div>
            </div>
        </div>
        <div id="sidebar">
            <div class="search-wrap">
                <span class="search-icon">🔍</span>
                <input id="street-search" type="text" placeholder="Search a street…" autocomplete="off" spellcheck="false" />
                <button id="search-clear" title="Clear search">✕</button>
                <div id="suggestions"></div>
            </div>
            <div class="sidebar-head">
                <h2 id="sidebar-title">Nearby Restrictions</h2>
                <span id="count-badge">–</span>
            </div>
            <div id="restrictions-list"><div class="loader">Loading map…</div></div>
        </div>
    </div>

    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script>
    <script>
        const PMTILES_URL = 'pmtiles://' + new URL('barnet_parking.pmtiles', location.href).href;
        const SOURCE_LAYER = 'parking';
        const BARNET_CENTER = [-0.1517, 51.6252]; // [lon, lat]
        const QUERY_LAYERS = ['parking-line', 'parking-point', 'parking-fill'];

        let map, userMarker, userLocation = null, openPopup = null;
        let streetIndex = [], activeStreet = null, streetMarker = null;

        const protocol = new pmtiles.Protocol();
        maplibregl.addProtocol('pmtiles', protocol.tile);

        // ---- Restriction categories (order = colour priority, first match wins) ----
        const restr = ['downcase', ['to-string', ['get', 'restriction']]];
        const CATS = [
            { id: 'nw',  label: 'No Waiting',      color: '#e91e63', pred: ['in', 'no waiting', restr] },
            { id: 'nl',  label: 'No Loading',      color: '#ff5722', pred: ['in', 'no loading', restr] },
            { id: 'pm',  label: 'Permit Only',     color: '#9c27b0', pred: ['in', 'permit', restr] },
            { id: 'db',  label: 'Disabled Only',   color: '#2196f3', pred: ['in', 'disabled', restr] },
            { id: 'pay', label: 'Payment Parking', color: '#4caf50', pred: ['any', ['in', 'payment', restr], ['in', 'parking', restr]] },
            { id: 'ped', label: 'Pedestrian',      color: '#ff9800', pred: ['in', 'pedestrian', restr] },
        ];
        const OTHER = { id: 'other', label: 'Other', color: '#607d8b' };
        const enabled = new Set([...CATS.map(c => c.id), OTHER.id]); // all on by default

        // colour expression for styling
        const colorExpr = ['case'];
        CATS.forEach(c => { colorExpr.push(c.pred, c.color); });
        colorExpr.push(OTHER.color);

        function colorFor(restriction) {
            const t = (restriction || '').toLowerCase();
            if (t.includes('no waiting')) return '#e91e63';
            if (t.includes('no loading')) return '#ff5722';
            if (t.includes('permit')) return '#9c27b0';
            if (t.includes('disabled')) return '#2196f3';
            if (t.includes('payment') || t.includes('parking')) return '#4caf50';
            if (t.includes('pedestrian')) return '#ff9800';
            return '#607d8b';
        }

        // Build the category filter from the enabled set
        function categoryFilter() {
            const parts = [];
            CATS.forEach(c => { if (enabled.has(c.id)) parts.push(c.pred); });
            if (enabled.has(OTHER.id)) parts.push(['!', ['any', ...CATS.map(c => c.pred)]]);
            if (!parts.length) return ['==', ['literal', 1], ['literal', 0]]; // match nothing
            return ['any', ...parts];
        }

        function applyFilters() {
            if (!map || !map.getLayer('parking-line')) return;
            const cat = categoryFilter();
            map.setFilter('parking-fill',  ['all', ['==', ['geometry-type'], 'Polygon'], cat]);
            map.setFilter('parking-line',  ['all', ['==', ['geometry-type'], 'LineString'], cat]);
            map.setFilter('parking-point', ['all', ['==', ['geometry-type'], 'Point'], cat]);
        }

        function buildLegend() {
            const wrap = document.getElementById('legend-items');
            wrap.innerHTML = '';
            [...CATS, OTHER].forEach(c => {
                const row = document.createElement('div');
                row.className = 'legend-item';
                row.dataset.id = c.id;
                row.innerHTML = `<div class="legend-color" style="background:${c.color}"></div>${c.label}`;
                row.onclick = () => {
                    if (enabled.has(c.id)) enabled.delete(c.id); else enabled.add(c.id);
                    row.classList.toggle('off', !enabled.has(c.id));
                    applyFilters();
                    setTimeout(refreshNearby, 120);
                };
                wrap.appendChild(row);
            });
        }

        function initMap(lon, lat) {
            map = new maplibregl.Map({
                container: 'map',
                style: {
                    version: 8,
                    sources: {
                        carto: {
                            type: 'raster',
                            tiles: [
                                'https://a.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png',
                                'https://b.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png',
                                'https://c.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png',
                                'https://d.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png'
                            ],
                            tileSize: 256,
                            attribution: '© OpenStreetMap contributors © CARTO'
                        }
                    },
                    layers: [{ id: 'carto', type: 'raster', source: 'carto' }]
                },
                center: [lon, lat], zoom: 16, maxZoom: 20
            });

            map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-left');

            userMarker = new maplibregl.Marker({ color: '#1a73e8' })
                .setLngLat([lon, lat])
                .setPopup(new maplibregl.Popup({ offset: 24 }).setHTML('<b>You are here</b>'))
                .addTo(map);

            buildLegend();

            map.on('load', () => {
                map.addSource('parking', { type: 'vector', url: PMTILES_URL });

                map.addLayer({
                    id: 'parking-fill', type: 'fill', source: 'parking', 'source-layer': SOURCE_LAYER,
                    filter: ['==', ['geometry-type'], 'Polygon'],
                    paint: { 'fill-color': colorExpr, 'fill-opacity': 0.22, 'fill-outline-color': colorExpr }
                });
                map.addLayer({
                    id: 'parking-line', type: 'line', source: 'parking', 'source-layer': SOURCE_LAYER,
                    filter: ['==', ['geometry-type'], 'LineString'],
                    layout: { 'line-cap': 'round', 'line-join': 'round' },
                    paint: {
                        'line-color': colorExpr,
                        'line-width': ['interpolate', ['linear'], ['zoom'], 12, 1.5, 16, 4, 19, 7],
                        'line-opacity': 0.9
                    }
                });
                map.addLayer({
                    id: 'parking-point', type: 'circle', source: 'parking', 'source-layer': SOURCE_LAYER,
                    filter: ['==', ['geometry-type'], 'Point'],
                    paint: {
                        'circle-radius': ['interpolate', ['linear'], ['zoom'], 12, 2, 16, 5, 19, 9],
                        'circle-color': colorExpr,
                        'circle-stroke-color': '#fff', 'circle-stroke-width': 1.2, 'circle-opacity': 0.92
                    }
                });

                setStatus(`📍 ${lat.toFixed(4)}, ${lon.toFixed(4)}`);
                QUERY_LAYERS.forEach(id => {
                    map.on('mouseenter', id, () => map.getCanvas().style.cursor = 'pointer');
                    map.on('mouseleave', id, () => map.getCanvas().style.cursor = '');
                });
                map.on('moveend', refreshNearby);
                map.on('sourcedata', onSourceData);
                map.on('click', onMapClick);
                refreshNearby();
                showToast();
            });

            map.on('error', (e) => {
                console.error(e && e.error);
                document.getElementById('restrictions-list').innerHTML =
                    `<div class="error"><strong>Map error:</strong><br>${(e && e.error && e.error.message) || 'Failed to load parking tiles.'}<br><br>Make sure <code>barnet_parking.pmtiles</code> is served over HTTP (Range requests).</div>`;
            });
        }

        function setStatus(t) { document.getElementById('status').textContent = t; }

        let toastTimer;
        function showToast() {
            const t = document.getElementById('toast');
            t.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('show'), 4200);
        }

        let firstDataShown = false;
        function onSourceData(e) {
            if (e.sourceId === 'parking' && e.isSourceLoaded && !firstDataShown) {
                firstDataShown = true; refreshNearby();
            }
        }

        function popupHTML(p) {
            return `<strong>${p.street_name || 'Unknown Street'}</strong><br>
                ${p.restriction || p.order_type || 'No restriction info'}<br>
                <em>Side: ${p.side_of_road || 'N/A'}</em>${p.length ? `<br>Length: ${p.length}m` : ''}`;
        }

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI/180, φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1)*Math.PI/180, Δλ = (lon2-lon1)*Math.PI/180;
            const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function repCoord(g) {
            if (!g) return null;
            if (g.type === 'Point') return g.coordinates;
            if (g.type === 'LineString') return g.coordinates[Math.floor(g.coordinates.length/2)];
            if (g.type === 'MultiLineString') return g.coordinates[0][0];
            if (g.type === 'Polygon') return g.coordinates[0][0];
            if (g.type === 'MultiPolygon') return g.coordinates[0][0][0];
            return null;
        }

        function dedupe(features) {
            const seen = new Set(), out = [];
            for (const f of features) {
                const p = f.properties || {};
                const key = `${p.street_name}|${p.restriction}|${p.side_of_road}`;
                if (seen.has(key)) continue;
                seen.add(key); out.push(f);
            }
            return out;
        }

        function setBadge(n) { document.getElementById('count-badge').textContent = n; }

        function refreshNearby() {
            if (!map) return;
            const list = document.getElementById('restrictions-list');
            const feats = dedupe(map.queryRenderedFeatures({ layers: QUERY_LAYERS }));

            // Street-focus mode: filter to the searched street only
            if (activeStreet) {
                const nameU = activeStreet.n;
                const sf = feats
                    .filter(f => ((f.properties || {}).street_name || '').toUpperCase() === nameU)
                    .map(f => {
                        const c = repCoord(f.geometry) || [activeStreet.lo, activeStreet.la];
                        return { p: f.properties || {}, lon: c[0], lat: c[1] };
                    });
                document.getElementById('sidebar-title').textContent = titleCase(nameU);
                setBadge(sf.length);
                const back = `<div style="margin-top:14px"><button class="reset-btn" onclick="clearSearch()">← Back to nearby</button></div>`;
                if (!sf.length) {
                    list.innerHTML = '<div class="loader">This street\'s restrictions aren\'t in view yet.<br>Zoom out slightly or pan to it.</div>' + back;
                    return;
                }
                list.innerHTML = sf.map(it => `
                    <div class="restriction-item" style="border-left-color:${colorFor(it.p.restriction)}"
                         onclick="flyTo(${it.lon},${it.lat})">
                        <div class="restriction-street">${it.p.street_name || 'Unknown Street'}</div>
                        <div class="restriction-type">${it.p.restriction || it.p.order_type || 'No info'}</div>
                        <div class="restriction-distance"><span class="pill">${it.p.side_of_road || 'N/A'}</span>${it.p.length ? `<span class="pill">${it.p.length} m</span>` : ''}</div>
                    </div>`).join('') + back;
                return;
            }

            if (!userLocation) return;
            document.getElementById('sidebar-title').textContent = 'Nearby Restrictions';
            setBadge(feats.length);

            const items = feats.map(f => {
                const c = repCoord(f.geometry); if (!c) return null;
                return { p: f.properties || {}, lon: c[0], lat: c[1],
                         distance: getDistance(userLocation.lat, userLocation.lon, c[1], c[0]) };
            }).filter(Boolean).sort((a,b) => a.distance - b.distance).slice(0, 25);

            if (!items.length) {
                list.innerHTML = '<div class="loader">No restrictions in view.<br>Zoom in (level 12+) or pan around Barnet.</div>';
                return;
            }
            list.innerHTML = items.map(it => `
                <div class="restriction-item" style="border-left-color:${colorFor(it.p.restriction)}"
                     onclick="flyTo(${it.lon},${it.lat})">
                    <div class="restriction-street">${it.p.street_name || 'Unknown Street'}</div>
                    <div class="restriction-type">${it.p.restriction || it.p.order_type || 'No info'}</div>
                    <div class="restriction-distance">${Math.round(it.distance)} m away
                        <span class="pill">${it.p.side_of_road || 'N/A'}</span></div>
                </div>`).join('');
        }

        function onMapClick(e) {
            activeStreet = null;
            if (streetMarker) { streetMarker.remove(); streetMarker = null; }
            const b = 8;
            const feats = dedupe(map.queryRenderedFeatures(
                [[e.point.x-b, e.point.y-b], [e.point.x+b, e.point.y+b]], { layers: QUERY_LAYERS }
            ));
            if (openPopup) openPopup.remove();
            if (!feats.length) return;

            const ll = e.lngLat;
            const items = feats.map(f => {
                const c = repCoord(f.geometry) || [ll.lng, ll.lat];
                return { p: f.properties || {}, lon: c[0], lat: c[1],
                         distance: getDistance(ll.lat, ll.lng, c[1], c[0]) };
            }).sort((a,b) => a.distance - b.distance).slice(0, 10);

            openPopup = new maplibregl.Popup({ maxWidth: '320px' }).setLngLat(ll).setHTML(`
                <div style="max-height:300px;overflow-y:auto;min-width:230px">
                    <strong>🅿️ ${items.length} restriction${items.length>1?'s':''} here</strong>
                    ${items.map(it => `
                        <div style="padding:8px 10px;margin:7px 0;background:#f8f9fa;border-radius:8px;
                                    border-left:3px solid ${colorFor(it.p.restriction)};font-size:12.5px">
                            <div style="font-weight:600">${it.p.street_name || 'Unknown Street'}</div>
                            <div style="color:#5f6368;margin:2px 0">${it.p.restriction || it.p.order_type || 'No info'}</div>
                            <div style="color:#1a73e8;font-size:11px">${it.p.side_of_road || 'N/A'}${it.p.length?` • ${it.p.length}m`:''}</div>
                        </div>`).join('')}
                </div>`).addTo(map);

            document.getElementById('sidebar-title').textContent = `At this spot`;
            setBadge(items.length);
            const list = document.getElementById('restrictions-list');
            list.innerHTML = items.map(it => `
                <div class="restriction-item" style="border-left-color:${colorFor(it.p.restriction)}"
                     onclick="flyTo(${it.lon},${it.lat})">
                    <div class="restriction-street">${it.p.street_name || 'Unknown Street'}</div>
                    <div class="restriction-type">${it.p.restriction || it.p.order_type || 'No info'}</div>
                    <div class="restriction-distance"><span class="pill">${it.p.side_of_road || 'N/A'}</span></div>
                </div>`).join('') +
                `<div style="margin-top:14px"><button class="reset-btn" onclick="resetView()">← Show nearest to me</button></div>`;
        }

        function flyTo(lon, lat) { map.flyTo({ center: [lon, lat], zoom: 18, speed: 1.4 }); }

        function resetView() {
            if (openPopup) openPopup.remove();
            if (userLocation) map.flyTo({ center: [userLocation.lon, userLocation.lat], zoom: 16 });
            refreshNearby();
        }

        document.getElementById('locate-btn').onclick = () => {
            if (!navigator.geolocation) return;
            setStatus('Locating…');
            navigator.geolocation.getCurrentPosition(
                pos => {
                    userLocation = { lon: pos.coords.longitude, lat: pos.coords.latitude };
                    userMarker.setLngLat([userLocation.lon, userLocation.lat]);
                    map.flyTo({ center: [userLocation.lon, userLocation.lat], zoom: 16, speed: 1.4 });
                    setStatus(`📍 ${userLocation.lat.toFixed(4)}, ${userLocation.lon.toFixed(4)}`);
                },
                () => setStatus('Location unavailable')
            );
        };

        // ---------- Street search ----------
        const searchEl = document.getElementById('street-search');
        const suggEl   = document.getElementById('suggestions');
        const clearEl  = document.getElementById('search-clear');
        let sugMatches = [], sugActive = -1;

        function titleCase(s) {
            return (s || '').toLowerCase().replace(/\b[a-z]/g, c => c.toUpperCase());
        }

        async function loadStreets() {
            try {
                const r = await fetch('streets.json');
                if (r.ok) streetIndex = await r.json();
            } catch (e) { console.warn('Street index unavailable:', e); }
        }

        function hideSugg() { suggEl.style.display = 'none'; sugActive = -1; }

        function renderSugg() {
            if (!sugMatches.length) { hideSugg(); return; }
            suggEl.innerHTML = sugMatches.map((e, i) => `
                <div class="sugg${i === sugActive ? ' active' : ''}" data-i="${i}">
                    <span class="nm">${titleCase(e.n)}</span>
                    <span class="cnt">${e.c} spot${e.c > 1 ? 's' : ''}</span>
                </div>`).join('');
            suggEl.style.display = 'block';
            suggEl.querySelectorAll('.sugg').forEach(el => {
                el.onmousedown = ev => { ev.preventDefault(); selectStreet(sugMatches[+el.dataset.i]); };
            });
        }

        function doSearch() {
            const q = searchEl.value.trim().toUpperCase();
            clearEl.style.display = q ? 'block' : 'none';
            if (q.length < 2) { hideSugg(); return; }
            const m = [];
            for (const e of streetIndex) if (e.n.includes(q)) m.push(e);
            m.sort((a, b) =>
                (a.n.startsWith(q) ? 0 : 1) - (b.n.startsWith(q) ? 0 : 1)
                || b.c - a.c || a.n.localeCompare(b.n));
            sugMatches = m.slice(0, 12);
            sugActive = -1;
            renderSugg();
        }

        function selectStreet(e) {
            if (!e || !map) return;
            activeStreet = e;
            searchEl.value = titleCase(e.n);
            hideSugg();
            if (streetMarker) streetMarker.remove();
            streetMarker = new maplibregl.Marker({ color: '#e91e63' }).setLngLat([e.lo, e.la]).addTo(map);
            if (openPopup) { openPopup.remove(); openPopup = null; }
            map.flyTo({ center: [e.lo, e.la], zoom: 16.5, speed: 1.5 });
            setTimeout(refreshNearby, 650); // in case moveend fires before tiles paint
        }

        function clearSearch() {
            searchEl.value = '';
            clearEl.style.display = 'none';
            hideSugg();
            activeStreet = null;
            if (streetMarker) { streetMarker.remove(); streetMarker = null; }
            refreshNearby();
        }

        searchEl.addEventListener('input', doSearch);
        searchEl.addEventListener('focus', doSearch);
        searchEl.addEventListener('keydown', ev => {
            if (suggEl.style.display !== 'block') return;
            if (ev.key === 'ArrowDown') { sugActive = Math.min(sugActive + 1, sugMatches.length - 1); renderSugg(); ev.preventDefault(); }
            else if (ev.key === 'ArrowUp') { sugActive = Math.max(sugActive - 1, 0); renderSugg(); ev.preventDefault(); }
            else if (ev.key === 'Enter') { selectStreet(sugMatches[sugActive >= 0 ? sugActive : 0]); ev.preventDefault(); }
            else if (ev.key === 'Escape') { hideSugg(); }
        });
        clearEl.addEventListener('click', clearSearch);
        document.addEventListener('click', ev => { if (!ev.target.closest('.search-wrap')) hideSugg(); });
        loadStreets();

        function start(lon, lat, msg) { userLocation = { lon, lat }; setStatus(msg); initMap(lon, lat); }
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                pos => start(pos.coords.longitude, pos.coords.latitude,
                             `📍 ${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`),
                () => start(BARNET_CENTER[0], BARNET_CENTER[1], 'Location off — showing Barnet centre')
            );
        } else {
            start(BARNET_CENTER[0], BARNET_CENTER[1], 'No geolocation — showing Barnet centre');
        }
    </script>
</body>
</html>
